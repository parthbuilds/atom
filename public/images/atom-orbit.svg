<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="atomNucleusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="atomRingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Atomic Orbit Ring 1 -->
  <ellipse cx="20" cy="20" rx="16" ry="9" transform="rotate(-30 20 20)" stroke="url(#atomRingGrad)" stroke-width="2" stroke-dasharray="3 1.5" />
  
  <!-- Atomic Orbit Ring 2 -->
  <ellipse cx="20" cy="20" rx="16" ry="9" transform="rotate(45 20 20)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.5" />

  <!-- Core Nucleus -->
  <circle cx="20" cy="20" r="4" fill="url(#atomNucleusGrad)" />
  <circle cx="18.8" cy="18.8" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Orbiting Electrons -->
  <circle cx="33.5" cy="12" r="2.2" fill="#2563eb" />
  <circle cx="33.5" cy="12" r="0.9" fill="#ffffff" />

  <circle cx="6.5" cy="27" r="1.8" fill="#0284c7" />
  <circle cx="6.5" cy="27" r="0.7" fill="#ffffff" />
</svg>
